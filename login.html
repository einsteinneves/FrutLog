<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>VitiLog - Login</title>
</head>
<body class="pagina-login">

    <div class="login">
        <!-- Lado Esquerdo - Banner -->
        <div class="caixa-do-login1">
            <h2 class="titulo-do-sistema">VitiLog</h2>
            <div class="banner-text">
                <h1>Bem-vindo!</h1>
                <p>Gestão e monitoramento inteligente para o seu cultivo.</p>
            </div>
        </div>

        <!-- Lado Direito - Formulário -->
        <div class="caixa-do-login2">
            <h2>Sign In</h2>
            <form action="/login" method="POST">
                <div class="input-field">
                    <i class="fa-solid fa-user icon-left"></i>
                    <input type="text" id="username" name="username" placeholder="Matrícula" required>
                </div>
                
                <div class="input-field">
                    <i class="fa-solid fa-lock icon-left"></i>
                    <input type="password" id="password" name="password" placeholder="Digite sua Senha" minlength="8" required>
                    <i class="fa-solid fa-eye icon-right" id="togglePassword"></i>
                </div>
                
                <div class="form-options">
                    <label><input type="checkbox"> Lembrar-me</label>
                    <a href="#">Esqueceu a senha?</a>
                </div>

                <button type="submit" class="btn-login">Entrar</button>
            </form>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
